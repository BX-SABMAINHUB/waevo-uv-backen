<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    <title>Waevo Browser</title>
    <meta name="description" content="Waevo Browser: navegador web proxeado de alta velocidad." />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#00e5ff" />
    <link rel="shortcut icon" content="favicon.ico" />

    <style>
        :root {
            --bg-0: #05050a;
            --bg-1: #0a0a14;
            --bg-2: #10101c;
            --panel: rgba(18, 18, 30, 0.55);
            --border: rgba(0, 229, 255, 0.18);
            --border-strong: rgba(0, 229, 255, 0.45);
            --cyan: #00e5ff;
            --cyan-glow: rgba(0, 229, 255, 0.55);
            --magenta: #bd00ff;
            --magenta-glow: rgba(189, 0, 255, 0.5);
            --text: #e8f6ff;
            --muted: #6b7a99;
            --danger: #ff2d6b;
            --grid: rgba(0, 229, 255, 0.06);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Rajdhani', 'Orbitron', 'Segoe UI', system-ui, sans-serif;
            color: var(--text);
            background: var(--bg-0);
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(900px 600px at 15% -10%, rgba(0, 229, 255, 0.12), transparent 60%),
                radial-gradient(900px 600px at 90% 110%, rgba(189, 0, 255, 0.12), transparent 60%),
                linear-gradient(180deg, #05050a 0%, #0a0a14 50%, #05050a 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(circle at 50% 40%, black 40%, transparent 85%);
            -webkit-mask-image: radial-gradient(circle at 50% 40%, black 40%, transparent 85%);
            z-index: -1;
            pointer-events: none;
        }

        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Layout principal ── */
        #waevo-home {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            gap: 28px;
            position: relative;
        }

        /* ── Logo ── */
        .logo-wrapper {
            flex-direction: column;
            gap: 14px;
            text-align: center;
            position: relative;
        }

        .logo-wrapper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 320px;
            height: 320px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, var(--cyan-glow) 0%, transparent 65%);
            opacity: 0.25;
            filter: blur(40px);
            z-index: -1;
            pointer-events: none;
            animation: pulseGlow 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.18; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.35; transform: translate(-50%, -50%) scale(1.1); }
        }

        .logo {
            width: 84px;
            height: 84px;
            object-fit: contain;
            filter: drop-shadow(0 0 18px var(--cyan-glow)) drop-shadow(0 0 30px var(--magenta-glow));
            animation: floatLogo 6s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .logo-wrapper h1 {
            margin: 0;
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(110deg, var(--cyan), var(--magenta) 55%, var(--cyan));
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 6s linear infinite;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.25);
        }

        @keyframes gradientShift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* ── Descripción ── */
        .desc {
            max-width: 640px;
            text-align: center;
            padding: 0 20px;
        }

        .desc p {
            color: var(--muted);
            font-size: 1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 0;
            font-weight: 500;
        }

        /* ── Formulario de búsqueda ── */
        #uv-form {
            width: 100%;
            max-width: 720px;
            position: relative;
            padding: 4px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--cyan), var(--magenta));
            box-shadow:
                0 0 25px rgba(0, 229, 255, 0.25),
                0 0 60px rgba(189, 0, 255, 0.15),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: stretch;
        }

        #uv-form:focus-within {
            transform: translateY(-2px);
            box-shadow:
                0 0 40px rgba(0, 229, 255, 0.55),
                0 0 90px rgba(189, 0, 255, 0.3),
                inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        #uv-address {
            flex: 1;
            height: 62px;
            padding: 0 26px;
            border: none;
            border-radius: 14px 0 0 14px;
            background: #07070d;
            color: var(--text);
            font-size: 1.05rem;
            font-family: inherit;
            letter-spacing: 1px;
            outline: none;
            transition: background 0.3s ease;
        }

        #uv-address::placeholder {
            color: var(--muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        #uv-address:focus {
            background: #0a0a14;
        }

        /* ── Botón Enter ── */
        .uv-submit-btn {
            width: 62px;
            border: none;
            background: #07070d;
            color: var(--cyan);
            cursor: pointer;
            border-radius: 0 14px 14px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            padding: 0;
        }

        .uv-submit-btn svg {
            transition: transform 0.25s ease, filter 0.25s ease;
            filter: drop-shadow(0 0 6px var(--cyan-glow));
        }

        .uv-submit-btn:hover {
            background: rgba(0, 229, 255, 0.12);
            color: #ffffff;
        }

        .uv-submit-btn:hover svg {
            transform: translateX(4px);
            filter: drop-shadow(0 0 12px var(--cyan));
        }

        .uv-submit-btn:active svg {
            transform: translateX(8px) scale(0.95);
        }

        /* ── Errores ── */
        #uv-error {
            color: var(--danger);
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
            margin: 8px 0 0 0;
            min-height: 20px;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        #uv-error-code {
            color: var(--muted);
            font-family: ui-monospace, 'Courier New', monospace;
            font-size: 0.75rem;
            text-align: center;
            white-space: pre-wrap;
            margin: 0;
            max-width: 640px;
        }

        /* ── Footer / Único enlace ── */
        footer {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            padding: 0 20px;
            z-index: 10;
        }

        .waevo-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 26px;
            border-radius: 30px;
            background: rgba(0, 229, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--cyan);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .waevo-link::before {
            content: '⚡';
            font-size: 1.1rem;
            filter: drop-shadow(0 0 6px var(--cyan-glow));
        }

        .waevo-link:hover {
            background: rgba(0, 229, 255, 0.14);
            border-color: var(--border-strong);
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow:
                0 0 25px rgba(0, 229, 255, 0.4),
                0 0 50px rgba(189, 0, 255, 0.2);
            letter-spacing: 2.5px;
        }

        /* ── Scanlines decorativas ── */
        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 3px,
                rgba(0, 229, 255, 0.02) 3px,
                rgba(0, 229, 255, 0.02) 4px
            );
        }

        /* ── Esquinas techno decorativas ── */
        .corner {
            position: fixed;
            width: 34px;
            height: 34px;
            border: 2px solid var(--cyan);
            opacity: 0.35;
            pointer-events: none;
            z-index: 2;
        }
        .corner.tl { top: 18px; left: 18px; border-right: none; border-bottom: none; }
        .corner.tr { top: 18px; right: 18px; border-left: none; border-bottom: none; }
        .corner.bl { bottom: 18px; left: 18px; border-right: none; border-top: none; }
        .corner.br { bottom: 18px; right: 18px; border-left: none; border-top: none; }

        /* ── Iframe a pantalla completa ── */
        #uv-frame {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            background: #ffffff;
            z-index: 9998;
            display: none;
        }

        #uv-frame.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ── Botón volver (en modo pantalla completa) ── */
        #uv-back-btn {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 10000;
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 30px;
            background: rgba(5, 5, 10, 0.85);
            border: 1px solid var(--border-strong);
            color: var(--cyan);
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.25);
        }

        #uv-back-btn.active {
            display: inline-flex;
        }

        #uv-back-btn:hover {
            background: rgba(0, 229, 255, 0.15);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.55);
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .logo-wrapper h1 { font-size: 1.8rem; letter-spacing: 2px; }
            .logo { width: 64px; height: 64px; }
            #uv-address { height: 54px; font-size: 0.95rem; padding: 0 20px; }
            .uv-submit-btn { width: 54px; }
            .desc p { font-size: 0.85rem; }
            .waevo-link { padding: 10px 20px; font-size: 0.8rem; }
        }
    </style>
</head>

<body>
    <!-- Decoración techno -->
    <div class="scanlines"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <!-- ══ HOME ══ -->
    <main id="waevo-home">
        <div title="Waevo Logo" class="flex-center logo-wrapper">
            <img class="logo" src="uv.png" alt="Waevo" />
            <h1>Waevo Browser</h1>
        </div>

        <div class="flex-center desc">
            <p>Navegador web proxeado de alta velocidad</p>
        </div>

        <form id="uv-form">
            <input
                id="uv-search-engine"
                value="https://www.google.com/search?q=%s"
                type="hidden"
            />
            <input id="uv-address" type="text" placeholder="Buscar en la web" autocomplete="off" spellcheck="false" />
            <button type="submit" class="uv-submit-btn" aria-label="Ir">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="desc">
            <p id="uv-error"></p>
            <pre id="uv-error-code"></pre>
        </div>
    </main>

    <!-- Único enlace -->
    <footer>
        <a class="waevo-link" href="https://waevo.onrender.com/active/" target="_blank" rel="noopener">
            Ir a Waevo
        </a>
    </footer>

    <!-- Iframe a pantalla completa -->
    <iframe id="uv-frame"></iframe>

    <!-- Botón volver -->
    <button id="uv-back-btn" type="button" title="Volver al inicio">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Volver
    </button>

    <!-- Scripts (mismos del original) -->
    <script src="baremux/index.js"></script>
    <script src="uv/uv.bundle.js"></script>
    <script src="uv/uv.config.js"></script>
    <script src="register-sw.js"></script>
    <script src="search.js"></script>
    <script src="index.js"></script>

    <!-- Lógica de pantalla completa al abrir URL -->
    <script>
        (function () {
            const frame = document.getElementById('uv-frame');
            const home = document.getElementById('waevo-home');
            const footer = document.querySelector('footer');
            const backBtn = document.getElementById('uv-back-btn');
            const form = document.getElementById('uv-form');
            const input = document.getElementById('uv-address');

            if (!frame) return;

            // Observa cambios en el atributo src del iframe
            const obs = new MutationObserver(() => {
                const src = frame.getAttribute('src');
                if (src && src !== '' && src !== 'about:blank') {
                    // Activar pantalla completa
                    frame.classList.add('active');
                    home.style.display = 'none';
                    footer.style.display = 'none';
                    backBtn.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
            });
            obs.observe(frame, { attributes: true, attributeFilter: ['src'] });

            // Botón volver: cierra la pantalla completa
            backBtn.addEventListener('click', () => {
                frame.classList.remove('active');
                frame.removeAttribute('src');
                home.style.display = '';
                footer.style.display = '';
                backBtn.classList.remove('active');
                document.body.style.overflow = '';
                input.value = '';
                input.focus();
            });

            // Al enviar el formulario, se dispara la navegación (search.js lo maneja).
            // Si por algún motivo search.js no lo maneja, hacemos fallback manual:
            form.addEventListener('submit', (e) => {
                // Dejamos que search.js haga su trabajo; si no está, forzamos
                setTimeout(() => {
                    const src = frame.getAttribute('src');
                    if (!src || src === '' || src === 'about:blank') {
                        // Fallback mínimo: usar UV directamente
                        const query = input.value.trim();
                        if (!query) return;
                        try {
                            if (typeof self.__uv$config !== 'undefined' && typeof Ultraviolet !== 'undefined') {
                                const url = query.includes('.') && !query.includes(' ')
                                    ? (query.startsWith('http') ? query : 'https://' + query)
                                    : 'https://www.google.com/search?q=' + encodeURIComponent(query);
                                frame.src = self.__uv$config.prefix + self.__uv$config.encodeUrl(url);
                            }
                        } catch (err) {
                            console.error('Fallback UV error:', err);
                        }
                    }
                }, 50);
            });
        })();
    </script>
</body>
</html>
